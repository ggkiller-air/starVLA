# Table 1: No Tactile. No tactile input and no future-observation objectives.
run_id: sonic_notactile
run_root_dir: results/Checkpoints
seed: 42
wandb_entity: wang-zih23
wandb_project: starvla-tactile-jepa
is_debug: false
version_id: "0.21"

framework:
  name: CosmosGR00T
  qwenvl:
    base_vlm: nvidia/Cosmos-Reason2-2B
    attn_implementation: sdpa
    vl_hidden_dim: 2048

  action_model:
    action_model_type: DiT-B
    hidden_size: 1024
    add_pos_embed: true
    max_seq_len: 1024
    action_dim: 78
    state_dim: 46
    action_horizon: 40
    repeated_diffusion_steps: 1
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 4
    num_target_vision_tokens: 32

    tactile_mode: notac
    tactile_encoder_type: mlp
    n_tactile_tokens: 8
    tactile_hidden_dim: 512
    tactile_num_heads: 8
    dream_horizon: 4
    vision_horizon: 4
    dream_hidden_dim: 1024
    dream_state: false
    dream_vision: false
    vision_target_dim: 2048
    ema_decay: 0.999
    tactile_dream_beta: 1.0
    lambda_tactile: 0.5
    lambda_state: 0.5
    lambda_vision: 0.5

    diffusion_model_cfg:
      cross_attention_dim: 2048
      output_dim: 1024
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      num_layers: 16
      positional_embeddings: null

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: ../data
    data_mix: desk_sweep
    lerobot_version: v2.0
    action_mode: abs
    include_state: true
    per_device_batch_size: 4
    num_workers: 4
    obs_image_size: [224, 224]
    video_backend: decord
    delete_pause_frame: false
    tactile_mode: notac
    dream_horizon: 4
    dream_state: false
    dream_vision: false
    vision_horizon: 4

trainer:
  max_train_steps: 120000
  num_warmup_steps: 6000
  save_interval: 30000
  eval_interval: 5000
  save_format: pt
  learning_rate:
    base: 1.0e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 5.0e-07
  freeze_modules: ""
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
